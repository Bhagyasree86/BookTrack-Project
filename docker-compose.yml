
services:
  db:
    image: mysql:8.4
    container_name: booktrack-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: booktrack_db
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
    ports:
      - "3307:3306"
    volumes:
      - booktrack-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: booktrack-backend
    restart: unless-stopped
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/booktrack_db
      SPRING_DATASOURCE_USERNAME: root
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy

volumes:
  booktrack-data:
